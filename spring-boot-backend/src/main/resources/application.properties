server.port=8080
spring.thymeleaf.cache=false
server.error.include-message=always
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
logging.level.org.thymeleaf=ERROR

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/aasha?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Uday@2006}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET:aasha-disaster-connect-secret-key-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration=86400000

# API base URL for Flutter app
api.base-url=http://localhost:8080

# MinIO
minio.endpoint=http://127.0.0.1:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=aasha-photos

# n8n WhatsApp Notification
n8n.webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/aasha-whatsapp}
