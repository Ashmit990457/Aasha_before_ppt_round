server.port=8080
spring.thymeleaf.cache=false
server.error.include-message=always
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
logging.level.org.thymeleaf=ERROR

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/aasha?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Government emergency-alert management identity. Prefer HEAD_OFFICIAL_EMAIL
# from the deployment environment; the default is only for the local demo.
head-official.email=${HEAD_OFFICIAL_EMAIL:ashmitsingh061@gmail.com}

# API base URL for Flutter app
api.base-url=${API_BASE_URL:http://localhost:8080}
matching.ai-url=${MATCHING_AI_URL:http://localhost:8000/api/v1/match}
matching.connect-timeout-ms=${MATCHING_CONNECT_TIMEOUT_MS:5000}
matching.read-timeout-ms=${MATCHING_READ_TIMEOUT_MS:120000}
matching.candidate-pool-size=${MATCHING_CANDIDATE_POOL_SIZE:100}
matching.age-tolerance=${MATCHING_AGE_TOLERANCE:5}
matching.media-base-url=${MEDIA_BASE_URL:${API_BASE_URL:http://localhost:8080}}

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET:aasha-photos}

# n8n WhatsApp Notification
n8n.webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/aasha-whatsapp}

# FCM server delivery. Credentials are supplied through Google ADC
# (GOOGLE_APPLICATION_CREDENTIALS) or the hosting environment; never commit them.
firebase.notifications.enabled=${FIREBASE_NOTIFICATIONS_ENABLED:false}
firebase.project-id=${FIREBASE_PROJECT_ID:}
